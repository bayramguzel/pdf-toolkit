name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3 (device_info_plus needs the iOS 26 SDK)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package into unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          rm -rf Payload PdfToolkit-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          zip -qry PdfToolkit-unsigned.ipa Payload
          ls -lh PdfToolkit-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfToolkit-unsigned-ipa
          path: PdfToolkit-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-${{ github.run_number }}
          name: Unsigned iOS IPA #${{ github.run_number }}
          body: |
            Unsigned iOS build produced by GitHub Actions.

            Download `PdfToolkit-unsigned.ipa` and install it with Sideloadly
            using your own Apple ID. See `ios/BUILD_SIDELOADLY.md` for details.
          files: PdfToolkit-unsigned.ipa
          prerelease: true
          draft: false
