<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Professional PDF Toolkit - Merge, split, compress, convert and edit PDF files online for free">
  <meta name="keywords"
    content="PDF toolkit, merge PDF, split PDF, compress PDF, convert PDF, edit PDF, online PDF tools">
  <meta name="author" content="41 Software">

  <!-- Open Graph -->
  <meta property="og:title" content="PDF Toolkit - Professional PDF Tools Online">
  <meta property="og:description" content="Merge, split, compress, convert and edit PDF files online for free">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pdftoolkit.41software.com">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PDF Toolkit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>PDF Toolkit - Professional PDF Tools Online</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #111827;
      gap: 20px;
    }

    #loading img {
      width: 100px;
      height: 100px;
      animation: pulse 2s ease-in-out infinite;
    }

    #loading-text {
      color: #9CA3AF;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 3px solid #3B82F6;
      width: 36px;
      height: 36px;
      animation: spin 0.9s linear infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="PDF Toolkit">
    <div class="spinner"></div>
    <div id="loading-text">PDF Toolkit yükleniyor...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
